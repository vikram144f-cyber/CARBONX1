services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carbonx
      POSTGRES_USER: carbonx
      POSTGRES_PASSWORD: carbonx
    ports:
      - "5432:5432"
    volumes:
      - carbonx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonx -d carbonx"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  carbonx-postgres-data:
